<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CourseCraft player</title>
  <link data-trunk rel="rust" href="Cargo.toml" data-bin="coursecraft-player" data-cargo-profile="wasm-release">
  <link data-trunk rel="copy-file" href="../../examples/hello-course/course.json">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #202124; }
    #coursecraft_canvas { width: 100%; height: 100%; display: block; }
    #coursecraft_loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #202124;
      color: #e8eaed;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      text-align: center;
      padding: 24px;
    }
    #coursecraft_loading_spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(232, 234, 237, 0.22);
      border-top-color: #e8eaed;
      border-radius: 50%;
      animation: coursecraft-spin 0.9s linear infinite;
    }
    #coursecraft_loading_text {
      margin: 0;
      max-width: 420px;
      line-height: 1.45;
    }
    @keyframes coursecraft-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #coursecraft_loading_spinner { display: none; animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="coursecraft_canvas"></canvas>
  <div id="coursecraft_loading" role="status" aria-live="polite">
    <div id="coursecraft_loading_spinner" aria-hidden="true"></div>
    <p id="coursecraft_loading_text">Loading course…</p>
  </div>
</body>
</html>

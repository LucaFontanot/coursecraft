[package]
name = "coursecraft"
description = "CourseCraft editor: the egui editor as a desktop app and a wasm web page."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[[bin]]
name = "coursecraft"
path = "src/main.rs"

[dependencies]
coursecraft-course.workspace = true
coursecraft-engine.workspace = true
coursecraft-ui-egui.workspace = true
coursecraft-ai.workspace = true
coursecraft-format.workspace = true
coursecraft-pptx.workspace = true
coursecraft-publish.workspace = true
coursecraft-scorm.workspace = true
coursecraft-xapi.workspace = true
eframe.workspace = true
egui.workspace = true
ehttp.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
coursecraft-cli.workspace = true
coursecraft-control.workspace = true
coursecraft-mcp.workspace = true
coursecraft-export.workspace = true
# The system clipboard on the desktop: egui-winit's clipboard feature for text,
# arboard directly to read pasted images.
egui-winit = { version = "0.37", default-features = false, features = ["clipboard"] }
arboard = { version = "3.6", default-features = false, features = ["image-data"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlAnchorElement", "HtmlCanvasElement", "HtmlElement", "Blob", "BlobPropertyBag", "Url", "console", "Location"] }

# Embeds the icon in the Windows .exe; build.rs only calls it when the target is Windows.
[build-dependencies]
winresource = "0.1"

[lints]
workspace = true

name: Release

# Runs when a version tag is pushed. It makes a draft release, so nothing is
# public until someone reads it and presses Publish. It can also be run by hand
# on a branch to test the builds: that keeps the files as run artifacts and
# makes no release. The release description is the version's section of
# CHANGELOG.md (scripts/release-notes.sh), so write that section before tagging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, name: macos }
          - { os: windows-2022, name: windows }
          - { os: ubuntu-24.04, name: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@1.99
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        run: cargo install trunk --locked
      # The player has to exist before the desktop app builds, so it ends up inside it.
      - run: cargo xtask build-player
      - run: cargo build --release -p coursecraft
      - name: Package for macOS
        if: matrix.name == 'macos'
        run: scripts/package-macos.sh "${GITHUB_REF_NAME#v}" target/release/coursecraft dist
      - name: Package for Windows (portable)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/coursecraft.exe "dist/CourseCraft-$($env:GITHUB_REF_NAME)-portable.exe"
      - name: Build Windows installer
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $cmd = Get-Command iscc -ErrorAction SilentlyContinue
          $iscc = if ($cmd) { $cmd.Source } else { $null }
          $defaultIscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not $iscc -and (Test-Path $defaultIscc)) {
            $iscc = $defaultIscc
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed with exit code $LASTEXITCODE" }
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) {
              $iscc = $cmd.Source
            } elseif (Test-Path $defaultIscc) {
              $iscc = $defaultIscc
            }
          }
          if (-not $iscc) { throw "ISCC.exe not found after installation" }
          $tag = $env:GITHUB_REF_NAME
          $ver = $tag.TrimStart('v')
          & $iscc "/DAppVersion=$ver" "/DOutputName=CourseCraft-$tag-setup" "/DOutputDir=$PWD\dist" "/DRepoRoot=$PWD" "packaging/windows/coursecraft.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
      - name: Package for Linux
        if: matrix.name == 'linux'
        run: |
          mkdir -p dist
          tar -czf "dist/CourseCraft-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C target/release coursecraft -C "$GITHUB_WORKSPACE" LICENSE-MIT LICENSE-APACHE ATTRIBUTION.md -C "$GITHUB_WORKSPACE/apps/coursecraft/icons" coursecraft-1024.png
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The description comes from this version's section of CHANGELOG.md;
      # the job fails if the section is missing.
      - run: ./scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum CourseCraft-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: release-notes.md
          files: dist/*

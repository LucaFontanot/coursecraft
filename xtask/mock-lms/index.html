<!DOCTYPE html>
<!--
  CourseCraft mock LMS (test tooling, never shipped).

  Thin browser UI shell over the compiled Rust `coursecraft-strict-lms` engine
  (`strict-lms-wasm`). Exposes `window.API` (SCORM 1.2) by default or
  `window.API_1484_11` (SCORM 2004 4th Edition) with ?standard=2004 or under
  /scorm2004/. Zero SCORM validation rules live in JavaScript.
  Inspect state from devtools via window.mockLms.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mock LMS</title>
  <style>
    :root {
      --bg: #f4f5f7; --panel: #ffffff; --text: #1f2328; --muted: #656d76;
      --border: #d8dee4; --accent: #2f6feb; --ok: #1a7f37; --bad: #cf222e;
      --warn: #9a6700; --bad-bg: #ffebe9;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0d1117; --panel: #161b22; --text: #e6edf3; --muted: #8d96a0;
        --border: #30363d; --accent: #4493f8; --ok: #3fb950; --bad: #f85149;
        --warn: #d29922; --bad-bg: #490202;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
      padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
    header h1 { font-size: 14px; margin: 0 8px 0 0; }
    .stat { color: var(--muted); }
    .stat b { color: var(--text); font-variant-numeric: tabular-nums; }
    .stat b.passed, .stat b.completed, .stat b.ok { color: var(--ok); }
    .stat b.failed, .stat b.bad { color: var(--bad); }
    .badge { display: inline-block; padding: 1px 6px; border-radius: 10px;
      font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .badge.ok { background: transparent; color: var(--ok); border: 1px solid var(--ok); }
    .badge.bad { background: var(--bad); color: #ffffff; }
    body:not(.mode-2004) [data-mode="04"] { display: none; }
    body.mode-2004 [data-mode="12"] { display: none; }
    button { font: inherit; padding: 4px 10px; border-radius: 6px; cursor: pointer;
      border: 1px solid var(--border); background: var(--bg); color: var(--text); }
    button:hover { border-color: var(--accent); }
    .spacer { flex: 1; }
    .course-nav { display: flex; gap: 16px; align-items: center; padding: 4px 16px;
      background: var(--panel); border-bottom: 1px solid var(--border); font-size: 12px; }
    .course-nav a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .course-nav a:hover { text-decoration: underline; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 440px; height: calc(100vh - 74px); }
    iframe { width: 100%; height: 100%; border: 0; background: #202124; }
    aside { display: flex; flex-direction: column; overflow: hidden;
      border-left: 1px solid var(--border); background: var(--panel); }
    .tabs { display: flex; gap: 4px; padding: 6px 8px; border-bottom: 1px solid var(--border);
      background: var(--bg); }
    .tab { padding: 4px 10px; border-radius: 6px; border: 1px solid transparent;
      background: transparent; color: var(--muted); font-weight: 500; }
    .tab.active { background: var(--panel); color: var(--text); border-color: var(--border); }
    .tab-pane { flex: 1; overflow: auto; display: none; }
    .tab-pane.active { display: block; }
    table { width: 100%; border-collapse: collapse; font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; }
    td { padding: 3px 8px; border-bottom: 1px solid var(--border); vertical-align: top; word-break: break-all; }
    td.n { color: var(--muted); width: 1%; white-space: nowrap; }
    tr.err td { color: var(--bad); }
    .v-empty { padding: 16px; color: var(--muted); font-size: 12px; }
    .v-item { padding: 8px 10px; border-bottom: 1px solid var(--border);
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .v-item.violation { background: var(--bad-bg); }
    .v-head { display: flex; gap: 8px; align-items: center; font-weight: 600; margin-bottom: 2px; }
    .v-item.violation .v-rule { color: var(--bad); }
    .v-item.warning .v-rule { color: var(--warn); }
    .v-el { color: var(--muted); }
    .v-msg { color: var(--text); word-break: break-word; }
    .v-section { padding: 6px 10px; font-size: 11px; font-weight: 600; text-transform: uppercase;
      color: var(--muted); background: var(--bg); border-bottom: 1px solid var(--border); }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; grid-template-rows: 60vh auto; height: auto; }
      aside { border-left: 0; border-top: 1px solid var(--border); min-height: 320px; }
    }
  </style>
</head>
<body>
  <nav class="course-nav">
    <a href="/index.html">hello-course</a>
    <a href="/showcase/index.html">showcase</a>
    <a href="/scorm2004/index.html">showcase (SCORM 2004)</a>
    <a href="/reference/index.html">reference course</a>
    <a href="/reference-2004/index.html">reference course (SCORM 2004)</a>
  </nav>
  <header>
    <h1>Mock LMS</h1>
    <span class="stat" data-mode="12">status <b id="s-status">-</b></span>
    <span class="stat" data-mode="12">score <b id="s-score">-</b></span>
    <span class="stat" data-mode="04">completion <b id="s-completion">-</b></span>
    <span class="stat" data-mode="04">success <b id="s-success">-</b></span>
    <span class="stat" data-mode="04">scaled <b id="s-scaled">-</b></span>
    <span class="stat">location <b id="s-location">-</b></span>
    <span class="stat">suspend <b id="s-suspend">0</b> chars</span>
    <span class="stat">interactions <b id="s-interactions">0</b></span>
    <span class="stat">session <b id="s-session">closed</b></span>
    <span class="stat">violations <b id="s-violations" class="badge ok">0</b></span>
    <span class="spacer"></span>
    <button id="relaunch" type="button">Relaunch course</button>
    <button id="reset" type="button">Reset learner</button>
  </header>
  <main>
    <iframe id="sco" title="Course"></iframe>
    <aside>
      <div class="tabs">
        <button id="tab-btn-log" class="tab active" type="button">Call Log</button>
        <button id="tab-btn-violations" class="tab" type="button">
          Violations <span id="tab-v-count" class="badge ok">0</span>
        </button>
      </div>
      <div id="pane-log" class="tab-pane active">
        <table><tbody id="log"></tbody></table>
      </div>
      <div id="pane-violations" class="tab-pane">
        <div id="violations-list" class="v-empty">No spec violations recorded.</div>
      </div>
    </aside>
  </main>
  <script type="module">
    "use strict";

    const is2004 = /[?&]standard=2004(?:&|$)/.test(location.search) ||
      /(^|\/)(scorm2004|reference-2004)(\/|$)/.test(location.pathname);
    if (is2004) document.body.classList.add("mode-2004");

    const KEY = (is2004 ? "coursecraft-mock-lms:scorm2004:" : "coursecraft-mock-lms:") +
      location.pathname.replace(/index\.html$/, "");
    const wasmBase = /(^|\/)(showcase|scorm2004|reference|reference-2004)(\/|$)/.test(location.pathname)
      ? "../strict-lms-wasm/"
      : "./strict-lms-wasm/";

    const logEl = document.getElementById("log");
    const violationsListEl = document.getElementById("violations-list");
    const tabBtnLog = document.getElementById("tab-btn-log");
    const tabBtnViolations = document.getElementById("tab-btn-violations");
    const paneLog = document.getElementById("pane-log");
    const paneViolations = document.getElementById("pane-violations");
    const frame = document.getElementById("sco");

    function selectTab(which) {
      const isLog = which === "log";
      tabBtnLog.classList.toggle("active", isLog);
      tabBtnViolations.classList.toggle("active", !isLog);
      paneLog.classList.toggle("active", isLog);
      paneViolations.classList.toggle("active", !isLog);
    }
    tabBtnLog.addEventListener("click", () => selectTab("log"));
    tabBtnViolations.addEventListener("click", () => selectTab("violations"));

    let engine;
    try {
      const mod = await import(wasmBase + "coursecraft_strict_lms_wasm.js");
      await mod.default(wasmBase + "coursecraft_strict_lms_wasm_bg.wasm");
      engine = new mod.StrictLmsWasm(is2004);
      const saved = localStorage.getItem(KEY);
      if (saved && engine.import_persisted_json(saved)) {
        engine.relaunch();
      }
    } catch (err) {
      violationsListEl.className = "v-item violation";
      violationsListEl.textContent = "Failed to load strict-lms-wasm (" + err + "). Run `cargo xtask package-example`.";
      selectTab("violations");
      throw err;
    }

    function persist() {
      try {
        localStorage.setItem(KEY, engine.export_persisted_json());
      } catch (e) {}
    }

    function setStat(id, value, className) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = value;
      el.className = className || "";
    }

    let renderedCallCount = 0;

    function renderCalls(calls) {
      if (calls.length < renderedCallCount) {
        logEl.textContent = "";
        renderedCallCount = 0;
      }
      for (let i = renderedCallCount; i < calls.length; i++) {
        const entry = calls[i];
        const tr = document.createElement("tr");
        if (entry.error_code !== "0") tr.className = "err";
        const td1 = document.createElement("td");
        td1.className = "n";
        td1.textContent = String(entry.index);
        const td2 = document.createElement("td");
        td2.textContent = entry.method + "(" + entry.args.map(a => JSON.stringify(a)).join(", ") +
          ") → " + JSON.stringify(entry.result);
        tr.appendChild(td1);
        tr.appendChild(td2);
        logEl.appendChild(tr);
        tr.scrollIntoView({ block: "nearest" });
      }
      renderedCallCount = calls.length;
    }

    function renderViolations(violations, warnings) {
      const count = violations.length;
      const badgeClass = count > 0 ? "badge bad" : "badge ok";
      const headerBadge = document.getElementById("s-violations");
      headerBadge.textContent = String(count);
      headerBadge.className = badgeClass;
      const tabBadge = document.getElementById("tab-v-count");
      tabBadge.textContent = String(count);
      tabBadge.className = badgeClass;

      violationsListEl.textContent = "";
      violationsListEl.className = "";
      if (count === 0 && warnings.length === 0) {
        const empty = document.createElement("div");
        empty.className = "v-empty";
        empty.textContent = "No spec violations recorded.";
        violationsListEl.appendChild(empty);
        return;
      }
      for (const v of violations) {
        violationsListEl.appendChild(buildIssueNode(v, "violation"));
      }
      if (warnings.length > 0) {
        const hdr = document.createElement("div");
        hdr.className = "v-section";
        hdr.textContent = "Advisory notes (" + warnings.length + ")";
        violationsListEl.appendChild(hdr);
        for (const w of warnings) {
          violationsListEl.appendChild(buildIssueNode(w, "warning"));
        }
      }
    }

    function buildIssueNode(item, kind) {
      const box = document.createElement("div");
      box.className = "v-item " + kind;
      const head = document.createElement("div");
      head.className = "v-head";
      const rule = document.createElement("span");
      rule.className = "v-rule";
      rule.textContent = "#" + item.call_index + " " + item.rule +
        (item.error_code ? " [" + item.error_code + "]" : "");
      const el = document.createElement("span");
      el.className = "v-el";
      el.textContent = item.element;
      head.appendChild(rule);
      head.appendChild(el);
      const msg = document.createElement("div");
      msg.className = "v-msg";
      msg.textContent = item.message;
      box.appendChild(head);
      box.appendChild(msg);
      return box;
    }

    function render() {
      const snap = JSON.parse(engine.snapshot_json());
      const calls = JSON.parse(engine.calls_json());
      const violations = JSON.parse(engine.violations_json());
      const warnings = JSON.parse(engine.warnings_json());

      if (is2004) {
        const completion = snap.completion_status || "-";
        const success = snap.success_status || "-";
        const scaled = snap.score && snap.score.scaled;
        setStat("s-completion", completion, completion);
        setStat("s-success", success, success);
        setStat("s-scaled", scaled === null || scaled === undefined || scaled === "" ? "-" : scaled);
        document.getElementById("s-location").textContent = snap.location || "-";
      } else {
        const status = snap.lesson_status || "-";
        const raw = snap.score && snap.score.raw;
        const max = snap.score && snap.score.max;
        setStat("s-status", status, status);
        document.getElementById("s-score").textContent =
          raw === "" || raw === undefined ? "-" : raw + " / " + (max || "?");
        document.getElementById("s-location").textContent = snap.lesson_location || "-";
      }
      document.getElementById("s-suspend").textContent = String((snap.suspend_data || "").length);
      document.getElementById("s-interactions").textContent = String((snap.interactions || []).length);
      const st = snap.state || "NotInitialized";
      document.getElementById("s-session").textContent =
        st === "Running" ? "open" : st === "NotInitialized" ? "idle" : "finished";

      renderCalls(calls);
      renderViolations(violations, warnings);
    }

    function callEngine(method, arg0, arg1, shouldPersist) {
      const a0 = arg0 === undefined || arg0 === null ? "" : String(arg0);
      const a1 = arg1 === undefined || arg1 === null ? "" : String(arg1);
      const res = engine.dispatch(method, a0, a1);
      if (shouldPersist) persist();
      console.log("[mock-lms] " + method + "(" + JSON.stringify(a0) +
        (arg1 !== undefined ? ", " + JSON.stringify(a1) : "") + ") -> " + JSON.stringify(res));
      render();
      return res;
    }

    const api12 = {
      LMSInitialize: (arg) => callEngine("LMSInitialize", arg, undefined, false),
      LMSFinish: (arg) => callEngine("LMSFinish", arg, undefined, true),
      LMSGetValue: (key) => callEngine("LMSGetValue", key, undefined, false),
      LMSSetValue: (key, val) => callEngine("LMSSetValue", key, val, false),
      LMSCommit: (arg) => callEngine("LMSCommit", arg, undefined, true),
      LMSGetLastError: () => engine.dispatch("LMSGetLastError", "", ""),
      LMSGetErrorString: (code) => engine.dispatch("LMSGetErrorString", code == null ? "" : String(code), ""),
      LMSGetDiagnostic: (code) => engine.dispatch("LMSGetDiagnostic", code == null ? "" : String(code), "")
    };

    const api2004 = {
      Initialize: (arg) => callEngine("Initialize", arg, undefined, false),
      Terminate: (arg) => callEngine("Terminate", arg, undefined, true),
      GetValue: (key) => callEngine("GetValue", key, undefined, false),
      SetValue: (key, val) => callEngine("SetValue", key, val, false),
      Commit: (arg) => callEngine("Commit", arg, undefined, true),
      GetLastError: () => engine.dispatch("GetLastError", "", ""),
      GetErrorString: (code) => engine.dispatch("GetErrorString", code == null ? "" : String(code), ""),
      GetDiagnostic: (code) => engine.dispatch("GetDiagnostic", code == null ? "" : String(code), "")
    };

    if (is2004) window.API_1484_11 = api2004;
    else window.API = api12;

    function launch() {
      frame.src = "package/index.html?launch=" + Date.now();
      render();
    }

    document.getElementById("relaunch").addEventListener("click", () => {
      frame.src = "about:blank";
      setTimeout(() => {
        engine.assert_clean_finish();
        engine.relaunch();
        persist();
        launch();
      }, 300);
    });

    document.getElementById("reset").addEventListener("click", () => {
      frame.src = "about:blank";
      setTimeout(() => {
        try { localStorage.removeItem(KEY); } catch (e) {}
        engine.reset();
        renderedCallCount = 0;
        logEl.textContent = "";
        launch();
      }, 300);
    });

    window.mockLms = {
      calls: () => JSON.parse(engine.calls_json()),
      violations: () => JSON.parse(engine.violations_json()),
      warnings: () => JSON.parse(engine.warnings_json()),
      snapshot: () => JSON.parse(engine.snapshot_json()),
      is2004
    };

    launch();
  </script>
</body>
</html>
